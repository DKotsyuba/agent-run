# Committed dependency policy. Advisory refresh belongs to `cargo xtask prepare`;
# the offline gate never invents advisory/license exceptions.
[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
ignore = []
maximum-db-staleness = "P1D"

[licenses]
allow = ["Apache-2.0", "BSD-3-Clause", "CDLA-Permissive-2.0", "ISC", "MIT", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.95

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies use the same committed source/version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

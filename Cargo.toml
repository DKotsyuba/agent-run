[workspace]
members = [
    "crates/sqlite-access",
    "crates/agent-run-domain",
    "crates/agent-run-platform",
    "crates/agent-run-config",
    "crates/agent-run-store",
    "crates/agent-run-adapters",
    "crates/agent-run-core",
    "crates/agent-run",
    "crates/agent-run-tui",
    "xtask",
]
exclude = ["vendor/tokio-rusqlite"]
resolver = "3"

[workspace.package]
version = "0.31.2"
edition = "2024"
license = "MIT"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
# Agent Bridge v0.7.0
bridge-sdk = { git = "https://github.com/DKotsyuba/agent-bridge.git", rev = "c12376fe8a89fd18dd4bb21e0c55aec1308e1e5f" }
jsonschema = { version = "=0.33.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
curve25519-dalek = { version = "=4.1.3", default-features = false }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
fs2 = "0.4"
libc = "0.2"
minijinja = { version = "=2.24.0", default-features = false, features = ["serde", "fuel"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
regex = "1.11"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "=0.41.1", features = ["bundled", "backup", "functions", "hooks", "fallible_uint"] }
serde = { version = "1.0", features = ["derive"] }
# Typed writer payload digests require lossless f64 parsing across JSON round trips.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.11"
tempfile = "3.19"
thiserror = "2.0"
tokio = { version = "1.44", features = ["rt", "rt-multi-thread", "macros", "process", "net", "io-util", "io-std", "signal", "time", "sync"] }
tokio-rusqlite = { path = "vendor/tokio-rusqlite", version = "=0.8.0" }
toml = "1.1"
uuid = { version = "1.16", features = ["v4"] }
url = "2.5.8"
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }

# Peer verification hashes the whole pinned executable inside a five-second
# budget; an unoptimized SHA-256 needs about 3s for a 115MB test binary, which a
# loaded CI runner turns into a timeout. Optimize only the digest crates.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.cpufeatures]
opt-level = 3

# Backtraces keep file/line; dependencies carry no debug info. This keeps test
# binaries small and links fast. Use `--profile debugging` for full debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Verify tag and build source archive
    runs-on: macos-15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Verify annotated tag and workspace version
        shell: bash
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Run Rust release gates
        run: |
          cargo xtask check
          node --test scripts/check-desktop-transport.cjs
      - name: Build and verify source archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cargo xtask archive --revision HEAD --output "dist/agent-run-$version-source.tar" --verify
      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source
          path: dist/agent-run-*-source.tar
          if-no-files-found: error
          retention-days: 7

  native:
    name: Build aarch64-apple-darwin archive
    needs: gate
    runs-on: macos-15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Verify native runner architecture
        run: test "$(uname -m)" = arm64
      - name: Run locked workspace gates
        run: cargo xtask check
      - name: Build and verify sealed native archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cargo xtask release build-native \
            --target aarch64-apple-darwin \
            --output "$RUNNER_TEMP/native" \
            --version "$version"
          cargo xtask release verify --release "$RUNNER_TEMP/native/releases/$version"
          tar -C "$RUNNER_TEMP/native/releases/$version" \
            -czf "dist/agent-run-$version-aarch64-apple-darwin.tar.gz" .
      - name: Upload native archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-aarch64-apple-darwin
          path: dist/agent-run-*-aarch64-apple-darwin.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified release
    needs: [gate, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Create aggregate checksums
        shell: bash
        run: |
          cd dist
          sha256sum agent-run-*.tar.gz agent-run-*-source.tar > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          test -z "$(gh release view "$GITHUB_REF_NAME" 2>/dev/null || true)"
          gh release create "$GITHUB_REF_NAME" \
            dist/agent-run-*.tar.gz \
            dist/agent-run-*-source.tar dist/SHA256SUMS \
            --generate-notes --title "$GITHUB_REF_NAME" --verify-tag

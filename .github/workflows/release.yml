name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Verify annotated tag and package version
        shell: bash
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install release tools
        run: |
          python -m pip install uv==0.11.1
          uv lock --check
          uv sync --locked --extra test --extra release --no-install-project --no-build
          uv pip install --python "$GITHUB_WORKSPACE/.venv/bin/python" --no-build-isolation --no-deps --editable .
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Run release tests
        shell: bash
        run: |
          pytest_filter=(-k "not test_delivery_queue_binary_is_optional_and_absolute and not test_codexbar_binary_defaults_to_homebrew_and_must_be_absolute")
          if ! python -m pytest -q --rootdir . tests "${pytest_filter[@]}"; then
            python -m pytest -q --rootdir . tests/test_launch.py
            python -m pytest -q --rootdir . tests "${pytest_filter[@]}"
          fi
      - name: Verify Linux path canonicalization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from agent_run.config import load_config

          with TemporaryDirectory() as directory:
              path = Path(directory) / "config.toml"
              path.write_text(
                  'schema_version = 1\n[delivery]\ncodex_queue_bin = "/bin/echo"\n',
                  encoding="utf-8",
              )
              assert load_config(path).delivery.codex_queue_bin == Path("/bin/echo").resolve()
              path.write_text(
                  'schema_version = 1\n[capacity]\ncodexbar_binary = "/bin/echo"\n',
                  encoding="utf-8",
              )
              assert load_config(path).capacity.codexbar_binary == Path("/bin/echo").resolve()
          PY
      - name: Build and check distributions
        run: |
          python -m build --no-isolation
          python -m twine check dist/*
          uv export --frozen --no-dev --no-editable --no-emit-project --format requirements-txt --output-file dist/requirements.lock
          uv export --frozen --extra release --no-dev --no-editable --no-emit-project --format requirements-txt --output-file dist/build-requirements.lock
      - name: Smoke wheel and source installs
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --require-hashes --only-binary=:all: -r dist/requirements.lock
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip check
          test "$("$RUNNER_TEMP/wheel-smoke/bin/python" -c 'from importlib.metadata import version; print(version("agent-run"))')" = "$version"
          AGENT_RUN_HOME="$RUNNER_TEMP/wheel-home" "$RUNNER_TEMP/wheel-smoke/bin/agent-run" init
          AGENT_RUN_HOME="$RUNNER_TEMP/wheel-home" "$RUNNER_TEMP/wheel-smoke/bin/agent-run" doc releases
          python -m venv "$RUNNER_TEMP/sdist-smoke"
          "$RUNNER_TEMP/sdist-smoke/bin/python" -m pip install --require-hashes --only-binary=:all: -r dist/build-requirements.lock
          "$RUNNER_TEMP/sdist-smoke/bin/python" -m pip install --no-build-isolation --no-deps dist/*.tar.gz
          "$RUNNER_TEMP/sdist-smoke/bin/python" -m pip check
          test "$("$RUNNER_TEMP/sdist-smoke/bin/python" -c 'from importlib.metadata import version; print(version("agent-run"))')" = "$version"
      - name: Write and verify checksums
        working-directory: dist
        run: |
          sha256sum agent_run-*.whl agent_run-*.tar.gz requirements.lock > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Attest release distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME"; then
            echo "release already exists: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl dist/*.tar.gz dist/requirements.lock dist/SHA256SUMS \
            --draft --generate-notes --title "$GITHUB_REF_NAME" --verify-tag
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

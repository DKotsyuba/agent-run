name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish macOS Apple-silicon release
    runs-on: macos-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify annotated tag and workspace version
        shell: bash
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Run Rust release gates
        run: |
          cargo xtask check
          cargo xtask qualify --release
          cargo xtask evidence verify
          node --test scripts/check-desktop-transport.cjs
      - name: Build and verify native and source archives
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cargo xtask release build-native --output dist/native --version "$version"
          cargo xtask release verify --release "dist/native/releases/$version"
          cargo xtask archive --revision HEAD --output "dist/agent-run-$version-source.tar" --verify
          tar -C "dist/native/releases/$version" -czf "dist/agent-run-$version-aarch64-apple-darwin.tar.gz" .
          cd dist
          shasum -a 256 "agent-run-$version-aarch64-apple-darwin.tar.gz" \
            "agent-run-$version-source.tar" > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test -z "$(gh release view "$GITHUB_REF_NAME" 2>/dev/null || true)"
          gh release create "$GITHUB_REF_NAME" \
            dist/agent-run-*-aarch64-apple-darwin.tar.gz \
            dist/agent-run-*-source.tar dist/SHA256SUMS \
            --generate-notes --title "$GITHUB_REF_NAME" --verify-tag

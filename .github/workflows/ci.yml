name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks (${{ matrix.label }})
    continue-on-error: ${{ matrix.continue_on_error }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: supported-macos-arm64
            target: aarch64-apple-darwin
            architecture: arm64
            continue_on_error: false
          - os: ubuntu-latest
            label: validation-only-linux-x86_64-unqualified
            target: x86_64-unknown-linux-gnu
            architecture: x86_64
            continue_on_error: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: agent-run-check-v2-${{ matrix.os }}-${{ matrix.architecture }}
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Verify native runner architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Verify shared filesystem support
        if: runner.os == 'macOS'
        run: |
          cargo test --offline --locked -p agent-run-platform --all-features --lib shared_assets -- --nocapture
          cargo test --offline --locked -p agent-run-platform --all-features --lib shared_asset_guard::tests::live_native_guard -- --ignored --exact
      - name: Run workspace gates
        run: cargo xtask check
      - name: Verify desktop transport and service probe fixtures
        run: node --test scripts/check-desktop-transport.cjs scripts/check-codegraph-probe.cjs
      - name: Build and verify sealed native release
        # The required release-contract job covers this exact macOS payload.
        # Keep the independent unqualified Linux build visible.
        if: runner.os != 'macOS'
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          cargo xtask release build-native \
            --target "${{ matrix.target }}" \
            --output "$RUNNER_TEMP/native" \
            --version "$version"
          cargo xtask release verify --release "$RUNNER_TEMP/native/releases/$version"

      - name: Restore native cargo-deny
        if: runner.os == 'macOS' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: cargo-deny-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ runner.arch }}-macos-15-0.20.2-${{ hashFiles('rust-toolchain.toml') }}
      - name: Prepare verified native cargo-deny
        if: runner.os == 'macOS' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ "$(cargo deny --version 2>/dev/null)" != 'cargo-deny 0.20.2' ]; then
            cargo install cargo-deny --version 0.20.2 --locked --force
          fi
          test "$(cargo deny --version)" = 'cargo-deny 0.20.2'
      - name: Save native cargo-deny
        if: runner.os == 'macOS' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-deny-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ steps.cargo-deny-cache.outputs.cache-primary-key }}

  release-contract:
    name: Rust release contract
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: agent-run-package-v1-macos-15-arm64
          cache-bin: false
          save-if: false
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Verify source archive
        run: |
          cargo xtask archive --verify
      - name: Build and verify sealed native release
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          cargo xtask release build-native --target aarch64-apple-darwin --output "$RUNNER_TEMP/native" --version "$version"
          cargo xtask release verify --release "$RUNNER_TEMP/native/releases/$version"

  # One trusted producer warms the same optimized target used by releases.
  # PRs restore that cache in release-contract and never update it.
  package-cache:
    name: Warm native package cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Verify native runner architecture
        run: test "$(uname -m)" = arm64
      - name: Restore optimized dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: agent-run-package-v1-macos-15-arm64
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Warm and verify native package workload
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          cargo xtask release build-native --target aarch64-apple-darwin --output "$RUNNER_TEMP/native" --version "$version"
          cargo xtask release verify --release "$RUNNER_TEMP/native/releases/$version"

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Restore cargo-deny
        id: cargo-deny-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-0.20.2-${{ hashFiles('rust-toolchain.toml') }}
      - name: Prepare verified cargo-deny
        shell: bash
        run: |
          if [ "$(cargo deny --version 2>/dev/null)" != 'cargo-deny 0.20.2' ]; then
            cargo install cargo-deny --version 0.20.2 --locked --force
          fi
          test "$(cargo deny --version)" = 'cargo-deny 0.20.2'
      - name: Refresh advisory database and check dependency policy
        run: cargo deny --locked check
      - name: Save cargo-deny
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-deny-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ steps.cargo-deny-cache.outputs.cache-primary-key }}

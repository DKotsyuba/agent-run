name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks (${{ matrix.label }})
    continue-on-error: ${{ matrix.continue_on_error }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: supported-macos-arm64
            target: aarch64-apple-darwin
            architecture: arm64
            continue_on_error: false
          - os: ubuntu-latest
            label: validation-only-linux-x86_64-unqualified
            target: x86_64-unknown-linux-gnu
            architecture: x86_64
            continue_on_error: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Verify native runner architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Run workspace gates
        run: cargo xtask check
      - name: Verify desktop transport and service probe fixtures
        run: node --test scripts/check-desktop-transport.cjs scripts/check-codegraph-probe.cjs
      - name: Build and verify sealed native release
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          cargo xtask release build-native \
            --target "${{ matrix.target }}" \
            --output "$RUNNER_TEMP/native" \
            --version "$version"
          cargo xtask release verify --release "$RUNNER_TEMP/native/releases/$version"

  release-contract:
    name: Rust release contract
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Verify source archive
        run: |
          cargo xtask archive --verify
      - name: Build and verify sealed native release
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          cargo xtask release build-native --output "$RUNNER_TEMP/native" --version "$version"
          cargo xtask release verify --release "$RUNNER_TEMP/native/releases/$version"

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.14" }
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test environment
        run: |
          python -m pip install uv==0.11.1
          uv lock --check
          uv sync --locked --extra test --extra release --no-install-project --no-build
          uv pip install --python "$GITHUB_WORKSPACE/.venv/bin/python" --no-build-isolation --no-deps --editable .
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Run tests
        shell: bash
        run: |
          pytest_filter=()
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            pytest_filter=(-k "not test_codexbar_binary_defaults_to_homebrew_and_must_be_absolute")
          fi
          first_test_status=0
          if python -m pytest -q --rootdir . tests "${pytest_filter[@]}"; then
            :
          else
            first_test_status=$?
            python -m pytest -q --rootdir . tests/test_launch.py || true
            python -m pytest -q --rootdir . tests "${pytest_filter[@]}" || true
          fi
          exit "$first_test_status"
      - name: Verify Linux path canonicalization
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from agent_run.config import load_config

          with TemporaryDirectory() as directory:
              path = Path(directory) / "config.toml"
              path.write_text(
                  'schema_version = 1\n[capacity]\ncodexbar_binary = "/bin/echo"\n',
                  encoding="utf-8",
              )
              assert load_config(path).capacity.codexbar_binary == Path("/bin/echo").resolve()
          PY

  package:
    name: Build and install distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install release tools
        run: |
          python -m pip install uv==0.11.1
          uv lock --check
          uv sync --locked --extra release --no-install-project --no-build
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Build and check metadata
        run: |
          python -m build --no-isolation
          python -m twine check dist/*
          uv export --frozen --no-dev --no-editable --no-emit-project --format requirements-txt --output-file dist/requirements.lock
          uv export --frozen --extra release --no-dev --no-editable --no-emit-project --format requirements-txt --output-file dist/build-requirements.lock
      - name: Smoke wheel and source installs
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --require-hashes --only-binary=:all: -r dist/requirements.lock
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip check
          test "$("$RUNNER_TEMP/wheel-smoke/bin/python" -c 'from importlib.metadata import version; print(version("agent-run"))')" = "$version"
          AGENT_RUN_HOME="$RUNNER_TEMP/wheel-home" "$RUNNER_TEMP/wheel-smoke/bin/agent-run" init
          AGENT_RUN_HOME="$RUNNER_TEMP/wheel-home" "$RUNNER_TEMP/wheel-smoke/bin/agent-run" doc releases
          python -m venv "$RUNNER_TEMP/sdist-smoke"
          "$RUNNER_TEMP/sdist-smoke/bin/python" -m pip install --require-hashes --only-binary=:all: -r dist/build-requirements.lock
          "$RUNNER_TEMP/sdist-smoke/bin/python" -m pip install --no-build-isolation --no-deps dist/*.tar.gz
          "$RUNNER_TEMP/sdist-smoke/bin/python" -m pip check
          test "$("$RUNNER_TEMP/sdist-smoke/bin/python" -c 'from importlib.metadata import version; print(version("agent-run"))')" = "$version"
          AGENT_RUN_HOME="$RUNNER_TEMP/sdist-home" "$RUNNER_TEMP/sdist-smoke/bin/agent-run" init

name: Rust migration validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # upstream-pinned checkout
        with:
          persist-credentials: false
      - name: Install stable toolchain components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Require a reviewed dependency lock
        run: |
          if [ ! -f Cargo.lock ]; then
            echo 'Release gate blocked: resolve, review and commit Cargo.lock.' >&2
            exit 1
          fi
      - name: Format, compile, lint and test
        run: ./scripts/check.sh
      - name: Release build
        run: cargo build --locked --release --bin agent-run

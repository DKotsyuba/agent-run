[package]
name = "agent-run"
version = "0.12.0-dev.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Durable local coding-agent supervisor — Rust migration"
repository = "https://github.com/DKotsyuba/agent-run"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4"
libc = "0.2"
regex = "1.11"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.44", features = ["rt", "rt-multi-thread", "macros", "process", "net", "io-util", "io-std", "signal", "time", "sync"] }
toml = "0.8"
uuid = { version = "1.16", features = ["v4"] }

rmcp = { version = "=1.8.0", default-features = false, features = ["server", "transport-io"] }

[dev-dependencies]
tempfile = "3.19"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[features]
test-fixtures = []

[[bin]]
name = "agent-run"
path = "src/main.rs"

[[bin]]
name = "agent-run-fixture"
path = "tests/fixtures/engine.rs"
required-features = ["test-fixtures"]

# Standalone package: this spike worktree is nested inside another worktree
# that is being converted into a Cargo workspace.
[workspace]

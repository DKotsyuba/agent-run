[package]
name = "tokio-rusqlite"
version = "0.8.0"
edition = "2021"
license = "MIT"
publish = false
description = "tokio-rusqlite 0.8.0 rebuilt on rusqlite 0.41 (upstream has not released it yet)"
repository = "https://github.com/programatik29/tokio-rusqlite"

[lib]
name = "tokio_rusqlite"
path = "src/lib.rs"

[dependencies]
crossbeam-channel = "0.5"
rusqlite = "0.41.1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }

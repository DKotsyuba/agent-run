# generated by agent-run; do not edit by hand
model_context_window = 1000000
model_auto_compact_token_limit = 780000
model_auto_compact_token_limit_scope = "total"

web_search = "disabled"

[agents]
enabled = false

[features]
apps = false
browser_use = false
code_mode_host = false
computer_use = false
hooks = true
js_repl = false
multi_agent = false
multi_agent_v2 = false
plugins = false
remote_plugin = false
request_permissions_tool = false
shell_tool = false
skill_mcp_dependency_install = false
skill_search = false
standalone_web_search = false
tool_suggest = false
unified_exec = false

[features.code_mode]
enabled = false

[[hooks.PermissionRequest]]
matcher = "^(?:mcp__agent-pool__|mcp__agent_pool__|mcp__agent_run_worker__)"

[[hooks.PermissionRequest.hooks]]
command = "/home/agent-mcp/.local/bin/agent-run _permission-request --allow-mcp agent-pool --allow-mcp agent_run_worker"
timeout = 600
type = "command"

[[hooks.PreToolUse]]
matcher = "mcp__agent-pool__.*"

[[hooks.PreToolUse.hooks]]
command = "/opt/agent-bridge/releases/0.7.0+c12376fe8a89/bin/bridge-hook /home/agent-mcp/.agent-bridge/run/ch/c.sock codex"
timeout = 600
type = "command"

[hooks.state."/home/agent-mcp/.agent-run/service-runtime/codex/runs/ag-20261111-013114-0cfb3a9d16/config.toml:permission_request:0:0"]
trusted_hash = "sha256:cecc02d49f7c6548936c8e29f50c43aecd6aeb9ff6900025b45aff48ab84e36f"

[hooks.state."/home/agent-mcp/.agent-run/service-runtime/codex/runs/ag-20261111-013114-0cfb3a9d16/config.toml:pre_tool_use:0:0"]
trusted_hash = "sha256:272cfb57e76774f961f2cfc77acd3cd8372d2e26edcecfcc85a1bed5bdaed848"

[mcp_servers.agent-pool]
args = [
    "mcp",
    "--config",
    "/home/agent-mcp/.agent-pool/config.toml",
]
command = "/home/agent-mcp/.local/bin/agent-pool"
default_tools_approval_mode = "approve"
enabled_tools = [
    "pool_add",
    "pool_cancel_replacement",
    "pool_close",
    "pool_create",
    "pool_get",
    "pool_join",
    "pool_list",
    "pool_member_update",
    "pool_notify_owner",
    "pool_post",
    "pool_propose",
    "pool_release_history",
    "pool_remove",
    "pool_send_member",
    "pool_update",
    "pool_vote",
]
env_vars = [
    "RUSTUP_HOME",
    "CARGO_HOME",
]

[mcp_servers.agent_run_worker]
args = ["_worker-mcp"]
command = "/home/agent-mcp/.local/bin/agent-run"
default_tools_approval_mode = "approve"
enabled_tools = [
    "finish",
    "health_reply",
]
env_vars = [
    "AGENT_RUN_WORKER_HOME",
    "AGENT_RUN_WORKER_RUN_ID",
    "AGENT_RUN_WORKER_ATTEMPT_ID",
    "AGENT_RUN_WORKER_TOKEN",
    "AGENT_RUN_WORKER_FINISH",
]

[projects."/home/agent-mcp/.agent-pool-qual/work/m2"]
trust_level = "trusted"

[tools]
view_image = false

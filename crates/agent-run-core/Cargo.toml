[features]
# Exposes deterministic test seams (never enabled in production builds).
test-fixtures = ["agent-run-store/test-fixtures"]

[dev-dependencies]
# Fenced raw store access for test fixtures; never part of a production build.
agent-run-store = { path = "../agent-run-store", features = ["test-fixtures"] }

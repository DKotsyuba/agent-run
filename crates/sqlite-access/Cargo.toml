[package]
name = "sqlite-access"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Bounded cancellation-safe SQLite access through one tokio-rusqlite writer"

[dependencies]
fs2 = "0.4"
libc = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53", features = ["rt", "sync"] }
tokio-rusqlite = "=0.8.0"

[dev-dependencies]
tempfile = "3.19"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-run"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-run = "agent_run.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_run" = ["operator_guide/*.md"]
"agent_run.state" = ["schema.sql", "migrations/*.sql"]
